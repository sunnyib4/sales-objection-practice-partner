# Matches the app already created by the earlier (incorrect) `fly launch`
# run -- reusing it rather than creating a third app. Region matches where
# its machines already exist.
app = "server-serene-blossom-6604"
primary_region = "lhr"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  # Keep at least one machine running at all times -- this is the whole
  # reason Fly was picked over a free tier that spins down on idle. Without
  # this, Fly's default autoscaling would still cold-start on a judge's
  # first request.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
