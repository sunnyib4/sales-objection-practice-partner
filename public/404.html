<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found -- Pushback</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #f5f5fb; --text: #15152b; --text-gray: #63637a;
      --accent: #1d4ed8; --card: #ffffff; --border: #e6e6f2;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a; --text: #eceef5; --text-gray: #9b9bb5;
        --accent: #3b82f6; --card: #1a1a2c; --border: #2d2d45;
        color-scheme: dark;
      }
    }
    body {
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--text);
      padding: 24px;
    }
    .wrap { text-align: center; max-width: 420px; }
    .nav-brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1rem; margin-bottom: 48px; }
    .nav-mark { width: 26px; height: 18px; position: relative; flex-shrink: 0; }
    .nav-mark span { position: absolute; width: 16px; height: 16px; border-radius: 999px; background: var(--text); }
    .nav-mark span:first-child { left: 0; top: 0; }
    .nav-mark span:last-child { left: 9px; top: 1px; background: var(--accent); }
    .code { font-size: 5rem; font-weight: 800; line-height: 1; margin: 0 0 16px; color: var(--accent); letter-spacing: -0.02em; }
    h1 { font-size: 1.3rem; margin: 0 0 12px; }
    p { font-size: 0.95rem; color: var(--text-gray); line-height: 1.5; margin: 0 0 32px; }
    a.home-btn {
      display: inline-block; text-decoration: none;
      background: var(--accent); color: #fff; font-weight: 700; font-size: 0.9rem;
      padding: 12px 26px; border-radius: 999px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    a.home-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(29, 78, 216, 0.25); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="nav-brand">
      <div class="nav-mark"><span></span><span></span></div>
      Pushback
    </div>
    <div class="code">404</div>
    <h1>This page doesn't exist</h1>
    <p>Whatever you were looking for isn't here. Might be a bad link, or the page moved.</p>
    <a class="home-btn" href="/">Back to Pushback</a>
  </div>
</body>
</html>
